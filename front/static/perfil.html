<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles/global.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gradient-to-b from-yellow-400 via-amber-500 to-yellow-600 hidden md:flex flex-col shadow-xl relative overflow-hidden z-20">
        <div class="absolute top-[-5%] left-[-20%] w-64 h-64 bg-yellow-300 rounded-full mix-blend-overlay filter blur-3xl opacity-50"></div>

        <div class="p-8 relative z-10">
            <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-md">NEXUS</h1>
        </div>

        <nav class="flex-1 px-4 space-y-2 relative z-10 mt-4">
            <a href="home.html" data-nav-link="home.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="gastos.html" data-nav-link="gastos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Nova Transação
            </a>
            <a href="metas.html" data-nav-link="metas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Metas
            </a>
            <a href="perfil.html" data-nav-link="perfil.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Meu Perfil
            </a>
        </nav>

        <div class="p-4 relative z-10">
            <button data-logout type="button" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-amber-900 bg-white/90 hover:bg-white rounded-xl font-bold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sair
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">

        <header class="md:hidden bg-amber-500 text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <a href="home.html" class="text-white hover:text-amber-100 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h1 class="text-2xl font-bold">NEXUS</h1>
            </div>
        </header>

        <div class="p-8 lg:p-12 max-w-4xl mx-auto w-full fade-in">

            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">Configurações de Conta</h2>
                    <p class="text-gray-500 mt-1">Gerencie suas informações pessoais e credenciais.</p>
                </div>
                <a href="home.html" class="hidden md:flex items-center gap-2 text-amber-600 hover:text-amber-700 font-semibold transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Voltar
                </a>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 flex flex-col md:flex-row items-center gap-8 mb-8">

                <div data-user-avatar id="avatar" class="w-28 h-28 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-4xl font-bold shadow-inner">
                    --
                </div>

                <div class="flex-1 text-center md:text-left">
                    <h3 id="displayNome" class="text-2xl font-bold text-gray-900">Carregando...</h3>
                    <p id="displayEmail" class="text-gray-500 text-lg mt-1">Aguarde um momento</p>
                    <div class="mt-4 inline-block bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
                        ID: <span id="displayId">--</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
                <h4 class="text-xl font-bold text-gray-900 mb-6">Informações Pessoais</h4>

                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Nome Completo</label>
                            <input type="text" id="inputNome" disabled
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-600 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                            <input type="email" id="inputEmail" disabled
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-600 cursor-not-allowed">
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/ui.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/perfil.js"></script>
</body>
</html>
