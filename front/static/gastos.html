<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Transação - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles/global.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gradient-to-b from-yellow-400 via-amber-500 to-yellow-600 hidden md:flex flex-col shadow-xl relative overflow-hidden z-20">
        <div class="absolute top-[-5%] left-[-20%] w-64 h-64 bg-yellow-300 rounded-full mix-blend-overlay filter blur-3xl opacity-50"></div>

        <div class="p-8 relative z-10">
            <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-md">NEXUS</h1>
        </div>

        <nav class="flex-1 px-4 space-y-2 relative z-10 mt-4">
            <a href="home.html" data-nav-link="home.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="gastos.html" data-nav-link="gastos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Nova Transação
            </a>
            <a href="metas.html" data-nav-link="metas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Metas
            </a>
            <a href="perfil.html" data-nav-link="perfil.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Meu Perfil
            </a>
        </nav>

        <div class="p-4 relative z-10">
            <button data-logout type="button" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-amber-900 bg-white/90 hover:bg-white rounded-xl font-bold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sair
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">

        <header class="md:hidden bg-amber-500 text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <a href="home.html" class="text-white hover:text-amber-100 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h1 class="text-2xl font-bold">NEXUS</h1>
            </div>
        </header>

        <div class="p-8 lg:p-12 max-w-6xl mx-auto w-full fade-in">

            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">Registrar Transação</h2>
                    <p class="text-gray-500 mt-1">Mantenha o controle informando os detalhes da sua transação.</p>
                </div>
                <a href="home.html" class="hidden md:flex items-center gap-2 text-amber-600 hover:text-amber-700 font-semibold transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Voltar
                </a>
            </div>

            <div id="alertMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold text-center fade-in"></div>

            <div class="flex flex-col lg:flex-row gap-8">

                <div class="flex-1 bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <form id="gastoForm" class="space-y-6">

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Tipo</label>
                            <div class="flex items-center gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="tipo" value="SAIDA" checked class="w-5 h-5 text-red-500 focus:ring-red-500 border-gray-300">
                                    <span class="text-gray-700 font-medium">Saída (despesa)</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="tipo" value="ENTRADA" class="w-5 h-5 text-green-500 focus:ring-green-500 border-gray-300">
                                    <span class="text-gray-700 font-medium">Entrada (receita)</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label for="valor" class="block text-sm font-bold text-gray-700 mb-1.5">Valor</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <span class="text-gray-500 font-bold sm:text-lg">R$</span>
                                </div>
                                <input type="text" id="valor" name="valor" required placeholder="0,00"
                                    class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-400 focus:border-red-400 outline-none transition-all duration-200 text-2xl font-bold text-gray-800">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="descricao" class="block text-sm font-medium text-gray-700 mb-1.5">Descrição</label>
                                <input type="text" id="descricao" name="descricao" required placeholder="Ex: Supermercado"
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all duration-200">
                            </div>

                            <div>
                                <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1.5">Categoria</label>
                                <div class="relative">
                                    <select id="categoria" name="categoria" required
                                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all duration-200 text-gray-700 appearance-none cursor-pointer">
                                        <option value="" disabled selected>Carregando...</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="data" class="block text-sm font-medium text-gray-700 mb-1.5">Data</label>
                            <input type="date" id="data" name="data" required
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all duration-200 text-gray-700 cursor-pointer">
                        </div>

                        <hr class="border-gray-100">

                        <button type="submit" id="submitBtn"
                            class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition-all duration-200 flex justify-center items-center group">
                            <span id="btnText">Salvar Transação</span>
                            <svg id="btnSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </form>
                </div>

                <div class="hidden lg:block w-80">
                    <div class="bg-gradient-to-br from-amber-500 to-yellow-600 rounded-3xl p-1 shadow-lg shadow-amber-200 sticky top-8">
                        <div class="bg-white rounded-[22px] p-6 h-full">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Resumo do Lançamento</p>

                            <div id="resumoIcone" class="flex items-center justify-center w-16 h-16 bg-red-50 text-red-500 rounded-full mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>

                            <h3 id="resumoValor" class="text-3xl font-bold text-gray-900 mb-1">R$ 0,00</h3>
                            <p id="resumoDescricao" class="text-gray-500 font-medium break-words">Sua descrição aqui</p>

                            <div class="mt-6 space-y-4">
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-400">Tipo</span>
                                    <span id="resumoTipo" class="font-semibold text-gray-800">Saída</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-400">Categoria</span>
                                    <span id="resumoCategoria" class="font-semibold text-gray-800 capitalize">-</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-gray-400">Data</span>
                                    <span id="resumoData" class="font-semibold text-gray-800">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/ui.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/gastos.js"></script>
</body>
</html>
