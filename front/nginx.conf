server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index static/index.html;

    # Cache estáticos por 7 dias
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Redireciona "/" para o index (que redireciona para login/home)
    location = / {
        return 302 /static/index.html;
    }

    # Qualquer outra rota — serve o arquivo ou cai no index.html
    location / {
        try_files $uri $uri/ /static/index.html;
    }
}
